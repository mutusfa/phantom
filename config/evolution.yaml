# Self-Evolution Engine Configuration
#
# Phase 3 simplified this file: the 6-judge pipeline is gone, replaced by a
# single reflection subprocess that the agent itself drives. Cadence tuning
# lives in phantom-config/meta/evolution.json at runtime.

# Reflection subprocess enable flag
reflection:
  # "auto" enables when an Agent SDK credential path exists
  # "always" enables unconditionally
  # "never" disables unconditionally (e.g. for offline CI)
  enabled: "auto"
  # Safety net against runaway costs (daily reset)
  cost_cap_usd_per_day: 50.0
  # Maximum golden suite entries (prune oldest when exceeded)
  max_golden_suite_size: 50

# Directory paths (relative to project root)
paths:
  config_dir: "data/phantom-config"
  constitution: "data/phantom-config/constitution.md"
  version_file: "data/phantom-config/meta/version.json"
  metrics_file: "data/phantom-config/meta/metrics.json"
  evolution_log: "data/phantom-config/meta/evolution-log.jsonl"
  session_log: "data/phantom-config/memory/session-log.jsonl"
  source_dir: "src"
  skills_dir: ".claude/skills"

# Expanded evolution capabilities (opt-in, disabled by default)
capabilities:
  # Allow the engine to modify phantom-config/ markdown files (user-profile, domain-knowledge, etc.)
  # Defaults true - set to false to freeze all config evolution.
  allow_config_changes: true
  # Allow the engine to modify TypeScript source files under src/
  # Requires typecheck to pass before changes are applied.
  allow_source_changes: false
  # Allow the engine to create/modify Claude Code skill files under .claude/skills/
  allow_skill_creation: true
  # Allow the engine to register/unregister dynamic MCP tools via the tool registry
  allow_tool_registration: false
